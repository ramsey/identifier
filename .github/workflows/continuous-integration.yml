# GitHub Actions Documentation: https://docs.github.com/en/actions

name: "Continuous Integration"

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: "1.99.99"

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-26.04"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "8.6"
          coverage: "none"
        env:
          update: "true"

      - name: "Install dependencies (Composer)"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: "Lint"
        run: "composer lint"

  coverage:
    name: "Coverage"
    needs: ["lint"]
    runs-on: "ubuntu-26.04"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "8.6"
          coverage: "xdebug-alpha"
          ini-values: "memory_limit=-1"
        env:
          update: "true"

      - name: "Install dependencies (Composer)"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: "Run tests"
        id: "tests"
        run: "composer coverage-ci"

      - name: "Publish coverage report to Codecov"
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1

      - name: "Publish test results to Codecov"
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          report_type: "test_results"
          files: "build/logs/junit.xml"
          disable_search: true
          flags: "php-8.6,ubuntu-26.04,highest"

  mutation:
    name: "Mutation tests"
    needs: ["lint"]
    runs-on: "ubuntu-26.04"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "8.6"
          coverage: "xdebug-alpha"
          ini-values: "memory_limit=-1"
        env:
          update: "true"

      - name: "Install dependencies (Composer)"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: "Run mutation tests"
        run: "composer mutation"

  benchmark:
    name: "Benchmark"
    needs: ["coverage"]
    runs-on: "ubuntu-26.04"

    strategy:
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"

    steps:
      - name: "Configure Git"
        run: "git config --global safe.directory '*'"

      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: "none"
          ini-values: "memory_limit=-1"
        env:
          update: "true"

      - name: "Install dependencies (Composer)"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: "Run benchmarks"
        run: |
          mkdir -p build/bench/
          composer bench-ci

      - name: "Upload benchmark reports"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "Benchmark (PHP ${{ matrix.php }})"
          path: "build/bench/"

  test:
    name: "Unit tests"
    needs: ["coverage"]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
        os:
          - "ubuntu-26.04"
          - "windows-2025"
          - "macos-26"
        composer-deps:
          - "lowest"
          - "highest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: "none"
        env:
          update: "true"

      - name: "Install dependencies (Composer)"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "${{ matrix.composer-deps }}"

      - name: "Run tests"
        run: "composer test"

      - name: "Publish test results to Codecov"
        if: ${{ !cancelled() }}
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          report_type: "test_results"
          files: "build/logs/junit.xml"
          disable_search: true
          flags: "php-${{ matrix.php }},${{ matrix.os }},${{ matrix.composer-deps }}"
